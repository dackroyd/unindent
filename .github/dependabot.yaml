version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release that turns out to be compromised is usually pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: ["/", "/corpus"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️"
