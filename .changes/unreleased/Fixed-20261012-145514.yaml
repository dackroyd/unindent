kind: Fixed
body: No fix is offered when an initialiser that has to move before the `if` declares a name already in scope, one that would hide a variable used after the `if`, or one that an earlier fix also moves into the same block. These fixes failed to compile in grpc-go, gopls, terraform, esbuild and nats-server, among others.
