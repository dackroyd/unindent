kind: Added
body: 'An `else` block that always exits after a body that does not is reported, with a fix that inverts the condition so the `else` block exits first and the body follows the `if`, as revive''s `early-return` suggests. The condition is negated as written, swapping `==` and `!=`, reversing `<` or `>=` for integers and strings, variable first, but not floating point numbers, where NaN makes `!(x < y)` and `x >= y` differ, and applying De Morgan''s laws to `&&` and `||` when every operand negates that way. An `if` whose condition needs an error that is not `nil`, such as `if err != nil { log.Print(err) } else { process(v); return }`, is not reported, so the happy path never ends up under `err == nil`; an `else` block that only exits, as in a retry loop''s `else { break }`, is. The new check is on by default, and `-exit-in-else=false` turns it off.'
