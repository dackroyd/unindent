kind: Added
body: 'Every terminating statement in the Go specification counts as an exit: `goto`, a `for` loop without a condition, a `select` whose cases all exit, `select {}`, a labelled statement that exits, and a `switch` case ending in `fallthrough`. A `for`, `switch` or `select` that a `break` refers to, by label too, does not count. A fix is withheld when a `goto` would jump over a declaration it moves.'
